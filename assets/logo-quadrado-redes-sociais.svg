<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1929"/>
      <stop offset="100%" stop-color="#112240"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066ff"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>

  <!-- Pattern de circuito (decorativo) -->
  <g opacity="0.08" stroke="#00ff88" stroke-width="1" fill="none">
    <line x1="0" y1="50" x2="120" y2="50"/>
    <line x1="120" y1="50" x2="120" y2="100"/>
    <line x1="280" y1="0" x2="280" y2="80"/>
    <line x1="280" y1="80" x2="350" y2="80"/>
    <line x1="0" y1="350" x2="80" y2="350"/>
    <line x1="80" y1="350" x2="80" y2="300"/>
    <circle cx="120" cy="50" r="3" fill="#00ff88"/>
    <circle cx="120" cy="100" r="3" fill="#00ff88"/>
    <circle cx="280" cy="80" r="3" fill="#00ff88"/>
    <circle cx="80" cy="300" r="3" fill="#00ff88"/>
  </g>

  <!-- Ícone centralizado -->
  <g transform="translate(150, 110)">
    <rect width="100" height="100" rx="22" fill="url(#accentGrad)"/>
    <path d="M28 28 L28 72 L40 72 L40 52 L56 72 L72 72 L50 47 L70 28 L56 28 L40 47 L40 28 Z" fill="white"/>
    <circle cx="78" cy="26" r="6" fill="#0a1929"/>
  </g>

  <!-- Texto -->
  <text x="200" y="270" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="42" font-weight="500" fill="white" text-anchor="middle">
    Cyber <tspan font-weight="800" fill="#00ff88">Informática</tspan>
  </text>
  <text x="200" y="305" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#66a3ff" text-anchor="middle" letter-spacing="3">
    CENTRO DE REMANUFATURA INDUSTRIAL
  </text>

  <!-- Linha decorativa -->
  <line x1="120" y1="325" x2="280" y2="325" stroke="url(#accentGrad)" stroke-width="2"/>

  <text x="200" y="360" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#8aa4c4" text-anchor="middle">
    Laminação OCA · Remanufatura de Displays
  </text>
</svg>
