<!DOCTYPE html>
<html>
<head>
<style>
body { margin: 0; padding: 40px; background: white; font-family: 'Inter', Arial, sans-serif; }
.section { margin-bottom: 60px; }
.title { font-size: 12px; color: #999; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }
.logo-light { background: white; padding: 20px; border: 1px solid #eee; display: inline-block; }
.logo-dark { background: #0a1929; padding: 20px; display: inline-block; }
</style>
</head>
<body>
<div class="section">
  <div class="title">Logo Horizontal — Light Background</div>
  <div class="logo-light">
    <img src="logo-horizontal.svg" width="400" height="120" id="logo1">
  </div>
</div>

<div class="section">
  <div class="title">Logo Horizontal — Dark Background</div>
  <div class="logo-dark">
    <img src="logo-horizontal.svg" width="400" height="120" id="logo2">
  </div>
</div>

<div class="section">
  <div class="title">Logo Quadrado — Redes Sociais</div>
  <img src="logo-quadrado-redes-sociais.svg" width="400" height="400" id="logo3">
</div>

<div class="section">
  <div class="title">Monograma / Favicon</div>
  <img src="logo-monograma.svg" width="200" height="200" id="logo4">
</div>
</body>
</html>
